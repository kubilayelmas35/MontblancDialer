<div id="page-login">
<div class="fluid-aurora fluid-aurora--login" aria-hidden="true"></div>
<div class="login-stage">
<div class="login-lockup">
<div class="login-logo-svg tb-logo is-blink" id="login-logo">
<div class="tb-logo-mark">
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
<g transform="rotate(-38 32 32)">
<rect class="tb-logo-eye tb-logo-eye--l" x="12" y="18" width="16" height="28" rx="8"/>
<rect class="tb-logo-eye tb-logo-eye--r" x="36" y="18" width="16" height="28" rx="8"/>
</g>
</svg>
</div>
</div>
<div>
<div class="login-brand-name"><span class="tb-logo-faces"><span class="tb-logo-face is-brand"><span class="tb-logo-word">callin</span><span class="tb-logo-one">.one</span></span><span class="tb-logo-face is-note" aria-hidden="true"><span class="tb-logo-word2"></span></span></span></div>
</div>
</div>
<div class="login-card">
<div class="login-card-body">
<div class="login-fields">
<div class="form-row">
<label class="form-label" id="lbl-email" data-i18n="login.email">E-posta</label>
<div class="login-field">
<svg class="login-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
<input class="form-input" type="email" id="login-email" data-i18n-placeholder="login.ph.email" placeholder="kullanici@firma.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
</div>
</div>
<div class="form-row">
<label class="form-label" id="lbl-pass" data-i18n="login.password">Şifre</label>
<div class="login-field">
<svg class="login-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
<input class="form-input" type="password" id="login-pass" data-i18n-placeholder="login.ph.pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
<button type="button" class="login-eye" onclick="toggleLoginPass()" id="login-eye" aria-label="Şifre"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
</div>
</div>
<div id="login-err" class="login-error"></div>
</div>
<div class="login-window">
<button class="login-btn" onclick="doLogin()" id="login-submit">
<span id="login-btn-label" data-i18n="login.btn">Giriş Yap</span>
</button>
</div>
<div class="login-card-foot">
<div class="login-demo" id="login-demo-hint" data-i18n="login.demo">Hesabı yöneticin açar.</div>
<div class="login-lang">
<button type="button" class="login-lang-btn login-lang-tr" onclick="setLang('tr')">TR</button>
<button type="button" class="login-lang-btn login-lang-de" onclick="setLang('de')">DE</button>
</div>
</div>
</div>
<div class="login-version">v__MB_VERSION__ — 2026</div>
</div>
</div>
