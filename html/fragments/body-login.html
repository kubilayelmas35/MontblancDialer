<div id="page-login">
<div class="fluid-aurora fluid-aurora--login" aria-hidden="true"></div>
<!-- Left branding panel -->
<div class="login-left">
<div class="login-brand">
<div class="login-logo-svg">
<svg width="48" height="48" viewBox="0 0 48 48" fill="none">
<rect width="48" height="48" rx="14" fill="white" fill-opacity=".15"/>
<path d="M10 34V14l14 10L38 14v20" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="24" cy="24" r="4" fill="white"/>
</svg>
</div>
<div class="login-brand-name">Montblanc</div>
<div class="login-brand-sub" data-i18n="login.brand.sub">Çağrı merkezi</div>
</div>
<div class="login-system">
<p class="login-system-lead" data-i18n="login.lead">Arama, ekip, saha, rapor ve ofis.</p>
<div class="login-system-board">
<section class="login-pane">

<div class="login-chips"><span data-i18n="login.chip.dialer">Dialer</span><span data-i18n="login.chip.camp">Kampanya</span><span data-i18n="login.chip.due">Aranacak</span><span data-i18n="login.chip.cal">Takvim</span></div>
</section>
<section class="login-pane">
<div class="login-pane-kicker"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.82"/></svg><span data-i18n="login.grp.team">Ekip</span></div>
<div class="login-chips"><span data-i18n="login.chip.live">Canlı ekran</span><span data-i18n="login.chip.perf">Performans</span><span data-i18n="login.chip.leave">İzin</span></div>
</section>
<section class="login-pane">
<div class="login-pane-kicker"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/></svg><span data-i18n="login.grp.report">Rapor</span></div>
<div class="login-chips"><span data-i18n="login.chip.stats">İstatistik</span><span data-i18n="login.chip.hist">Geçmiş</span><span data-i18n="login.chip.export">Aktarım</span></div>
</section>
<section class="login-pane">
<div class="login-pane-kicker"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M3 21h18M6 21V7l6-4 6 4v14"/><path d="M10 21v-4h4v4"/></svg><span data-i18n="login.grp.office">Ofis</span></div>
<div class="login-chips"><span data-i18n="login.chip.field">Saha</span><span data-i18n="login.chip.qc">Kalite</span><span data-i18n="login.chip.books">Muhasebe</span></div>
</section>
</div>
<div class="login-flow">
<span data-i18n="login.flow.1">Ara</span>
<span class="login-flow-line" aria-hidden="true"></span>
<span data-i18n="login.flow.2">Sonuç</span>
<span class="login-flow-line" aria-hidden="true"></span>
<span data-i18n="login.flow.3">Randevu</span>
<span class="login-flow-line" aria-hidden="true"></span>
<span data-i18n="login.flow.4">Rapor</span>
</div>
</div>
<div class="login-version">v__MB_VERSION__ — 2026</div>
</div>
<!-- Right form panel -->
<div class="login-right">
<div class="login-card">
<div class="login-card-logo">
<div class="login-logo-mark">
<svg width="28" height="28" viewBox="0 0 48 48" fill="none">
<path d="M10 34V14l14 10L38 14v20" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="24" cy="24" r="4" fill="white"/>
</svg>
</div>
<div>
<div class="login-title" data-i18n="login.welcome">Giriş</div>
<div class="login-sub" data-i18n="login.subtitle">E-posta ve şifre</div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:14px;">
<div class="form-row">
<label class="form-label" id="lbl-email" data-i18n="login.email">E-posta</label>
<div style="position:relative;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
<input class="form-input" type="email" id="login-email" data-i18n-placeholder="login.ph.email" placeholder="kullanici@firma.com" autocomplete="email" style="padding-left:36px;" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
</div>
</div>
<div class="form-row">
<label class="form-label" id="lbl-pass" data-i18n="login.password">Şifre</label>
<div style="position:relative;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
<input class="form-input" type="password" id="login-pass" data-i18n-placeholder="login.ph.pass" placeholder="••••••••" autocomplete="current-password" style="padding-left:36px;padding-right:40px;" onkeydown="if(event.key==='Enter')doLogin()">
<button onclick="toggleLoginPass()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);padding:2px;" id="login-eye"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
</div>
</div>
<div id="login-err" class="login-error"></div>
<div>
<button class="login-btn" onclick="doLogin()" id="login-submit">
<span id="login-btn-label" data-i18n="login.btn">Giriş Yap</span>
</button>
<div class="login-demo" id="login-demo-hint" data-i18n="login.demo">Hesabı yöneticin açar.</div>
</div>
<div style="display:flex;justify-content:center;gap:8px;">
<button class="btn btn-ghost btn-sm" onclick="setLang('tr')">TR</button>
<button class="btn btn-ghost btn-sm" onclick="setLang('de')">DE</button>
</div>
</div>
</div>
</div>
